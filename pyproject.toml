[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-ml"
version = "0.1.0"
description = "Longitudinal clinical machine-learning research pipeline for heart-failure cohorts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "torch>=2.2",
    "PyYAML>=6",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
shap = ["shap>=0.44"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
